[project]
name = "trainextend"
version = "0.2.0"
description = "Lightweight Modal-based runner for resumable time-series forecasting experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]
modal = ["modal>=0.64.0"]

[project.scripts]
trainextend = "trainextend.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["trainextend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
